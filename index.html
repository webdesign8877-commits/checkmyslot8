<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkmyslot</title>
  <style>
    :root{
      --bg1:#070316;
      --bg2:#0b1236;
      --card:#0e0b1f;
      --stroke:rgba(255,255,255,.12);
      --txt:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --accent:#7c5cff;
      --accent2:#00e5ff;
      --glow:rgba(124,92,255,.45);
      --glow2:rgba(0,229,255,.35);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--txt);
      min-height:100svh;
      overflow-x:hidden;
      background:
        radial-gradient(900px 600px at 20% 15%, rgba(124,92,255,.28), transparent 60%),
        radial-gradient(900px 600px at 85% 25%, rgba(0,229,255,.22), transparent 60%),
        radial-gradient(700px 600px at 50% 90%, rgba(255,64,129,.14), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
    }

    /* floating sparkles */
    .sparkles{position:fixed; inset:0; pointer-events:none; overflow:hidden;}
    .sparkle{
      position:absolute;
      width:10px; height:10px;
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%);
      filter:drop-shadow(0 0 10px rgba(124,92,255,.35));
      opacity:.8;
      animation: drift var(--t) linear infinite;
    }
    @keyframes drift{
      from{ transform:translate3d(var(--x1), 110vh, 0) scale(var(--s)); }
      to{ transform:translate3d(var(--x2), -20vh, 0) scale(var(--s)); }
    }

    header{
      position:sticky;
      top:0;
      backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(7,3,22,.82), rgba(7,3,22,.35));
      border-bottom:1px solid rgba(255,255,255,.08);
      z-index:10;
    }

    .wrap{max-width:1200px; margin:0 auto; padding:18px 18px 26px;}
    .top{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .brand{
      display:flex; align-items:center; gap:12px;
    }
    .chip{
      width:44px; height:44px; border-radius:14px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 40%),
        linear-gradient(135deg, rgba(124,92,255,.9), rgba(0,229,255,.7));
      box-shadow:
        0 12px 32px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.14) inset,
        0 0 40px rgba(124,92,255,.22);
      position:relative;
      overflow:hidden;
      animation: chipPulse 2.8s ease-in-out infinite;
    }
    .chip::after{
      content:"";
      position:absolute; inset:-50%;
      background:conic-gradient(from 180deg, rgba(255,255,255,0), rgba(255,255,255,.18), rgba(255,255,255,0));
      animation: spin 3.4s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes chipPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

    h1{
      margin:0;
      font-size:28px;
      letter-spacing:.2px;
      line-height:1.1;
    }
    .subtitle{margin:4px 0 0; color:var(--muted); font-size:13px}

    .controls{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }

    .seg{
      display:flex;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(10,8,22,.55);
      border-radius:999px;
      padding:5px;
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
    }
    .seg button{
      border:0;
      background:transparent;
      color:var(--muted);
      padding:10px 14px;
      border-radius:999px;
      font-weight:700;
      letter-spacing:.2px;
      cursor:pointer;
      transition: .18s ease;
      user-select:none;
    }
    .seg button.active{
      color:var(--txt);
      background: linear-gradient(135deg, rgba(124,92,255,.9), rgba(0,229,255,.75));
      box-shadow: 0 10px 26px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.18) inset;
    }

    .search{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(10,8,22,.55);
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
      min-width:260px;
    }
    .search svg{opacity:.8}
    .search input{
      width:100%;
      border:0;
      outline:0;
      color:var(--txt);
      background:transparent;
      font-size:14px;
    }
    .search input::placeholder{color:rgba(255,255,255,.55)}

    main{padding: 22px 0 34px;}

    .hint{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin: 10px 0 16px;
      color:var(--muted);
      font-size:13px;
    }
    .badge{
      display:inline-flex;
      gap:8px; align-items:center;
      border:1px solid rgba(255,255,255,.12);
      padding:8px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
    }
    .dot{
      width:8px; height:8px; border-radius:99px;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow:0 0 12px rgba(124,92,255,.45);
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 18px;
    }

    @media (max-width:1100px){.grid{grid-template-columns: repeat(5, 1fr)}}
    @media (max-width:980px){.grid{grid-template-columns: repeat(4, 1fr)}}
    @media (max-width:760px){.grid{grid-template-columns: repeat(3, 1fr)}}
    @media (max-width:520px){.grid{grid-template-columns: repeat(2, 1fr)} .search{min-width:100%}}

    .card{
      position:relative;
      border-radius:999px;
      aspect-ratio:1/1;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.12), transparent 35%),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.12);
      overflow:hidden;
      cursor:pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      box-shadow:
        0 18px 44px rgba(0,0,0,.38),
        0 0 0 1px rgba(255,255,255,.08) inset;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-30%;
      background:conic-gradient(from 220deg,
        rgba(124,92,255,.0),
        rgba(124,92,255,.35),
        rgba(0,229,255,.30),
        rgba(255,64,129,.20),
        rgba(124,92,255,.0)
      );
      filter: blur(14px);
      opacity:.65;
      animation: swirl 6.6s linear infinite;
    }
    @keyframes swirl{to{transform:rotate(360deg)}}

    .card:hover{
      transform: translateY(-3px) scale(1.02);
      border-color: rgba(255,255,255,.22);
      box-shadow:
        0 20px 56px rgba(0,0,0,.44),
        0 0 32px var(--glow),
        0 0 28px var(--glow2);
    }

    .inner{
      position:absolute; inset:10px;
      border-radius:999px;
      background: rgba(7,3,22,.72);
      border:1px solid rgba(255,255,255,.10);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:16px;
      text-align:center;
    }

    .logo{
      width:58px; height:58px;
      border-radius:16px;
      background:rgba(255,255,255,.06);
      display:grid; place-items:center;
      overflow:hidden;
      box-shadow: 0 10px 26px rgba(0,0,0,.30);
    }
    .logo img{
      width:100%; height:100%; object-fit:cover;
      transform: scale(1.02);
    }

    .name{
      font-weight:900;
      letter-spacing:.25px;
      font-size:14px;
      line-height:1.15;
      text-shadow: 0 8px 24px rgba(0,0,0,.45);
    }

    .tag{
      font-size:11px;
      color:rgba(255,255,255,.75);
      border:1px solid rgba(255,255,255,.12);
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
    }

    .empty{
      margin:40px 0 0;
      color:rgba(255,255,255,.7);
      text-align:center;
      padding:28px;
      border:1px dashed rgba(255,255,255,.18);
      border-radius:18px;
      background:rgba(255,255,255,.05);
    }

    /* modal */
    .modal-backdrop{
      position:fixed; inset:0;
      background:rgba(0,0,0,.62);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:50;
    }
    .modal{
      width:min(520px, 100%);
      border-radius:22px;
      background: rgba(10,8,22,.92);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 26px 80px rgba(0,0,0,.55);
      overflow:hidden;
    }
    .modal header{
      position:relative;
      background:transparent;
      border:0;
      backdrop-filter:none;
    }
    .modal-head{
      padding:16px 16px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .modal-title{margin:0; font-size:18px; font-weight:900;}
    .modal-sub{margin:4px 0 0; color:var(--muted); font-size:12px;}
    .x{
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:var(--txt);
      border-radius:12px;
      width:38px; height:38px;
      cursor:pointer;
      font-size:18px;
      line-height:1;
    }
    .modal-body{padding: 0 16px 16px;}
    .links{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
    .linkbtn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      color:var(--txt);
      text-decoration:none;
      font-weight:800;
      letter-spacing:.2px;
      transition:.16s ease;
    }
    .linkbtn:hover{transform:translateY(-1px); border-color:rgba(255,255,255,.22); box-shadow:0 0 26px rgba(124,92,255,.22)}
    .arrow{opacity:.85}

    footer{
      padding: 10px 18px 22px;
      color: rgba(255,255,255,.55);
      font-size:12px;
      text-align:center;
    }
  </style>
</head>

    // ======= UI STATE =======
    let mode = "player"; // 'player' | 'agent'

    const els = {
      grid: document.getElementById('grid'),
      empty: document.getElementById('empty'),
      count: document.getElementById('count'),
      search: document.getElementById('search'),
      btnPlayer: document.getElementById('btnPlayer'),
      btnAgent: document.getElementById('btnAgent'),
      modeLabel: document.getElementById('modeLabel'),
      year: document.getElementById('year'),
      modalBackdrop: document.getElementById('modalBackdrop'),
      modalClose: document.getElementById('modalClose'),
      modalTitle: document.getElementById('modalTitle'),
      modalSub: document.getElementById('modalSub'),
      modalLinks: document.getElementById('modalLinks'),
      sparkles: document.getElementById('sparkles')
    };

    els.year.textContent = new Date().getFullYear();

    function setMode(next){
      mode = next;
      const isPlayer = mode === 'player';
      els.btnPlayer.classList.toggle('active', isPlayer);
      els.btnAgent.classList.toggle('active', !isPlayer);
      els.btnPlayer.setAttribute('aria-selected', String(isPlayer));
      els.btnAgent.setAttribute('aria-selected', String(!isPlayer));
      els.modeLabel.textContent = isPlayer ? 'Player' : 'Agent';
      render();
    }

    els.btnPlayer.addEventListener('click', () => setMode('player'));
    els.btnAgent.addEventListener('click', () => setMode('agent'));

    els.search.addEventListener('input', render);

    // ======= RENDER =======
    function normalize(s){ return (s || '').toLowerCase().trim(); }

    function render(){
      const q = normalize(els.search.value);
      const filtered = GAMES.filter(g => normalize(g.name).includes(q));

      els.grid.innerHTML = '';
      els.count.textContent = filtered.length;
      els.empty.style.display = filtered.length ? 'none' : 'block';

      for(const g of filtered){
        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${g.name} (${mode})`);

        const inner = document.createElement('div');
        inner.className = 'inner';

        const logo = document.createElement('div');
        logo.className = 'logo';
        const img = document.createElement('img');
        img.alt = g.name;
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        img.src = g.image || '';
        img.onerror = () => {
          img.remove();
          logo.style.background = 'linear-gradient(135deg, rgba(124,92,255,.55), rgba(0,229,255,.35))';
          logo.innerHTML = `<span style="font-weight:900; font-size:18px;">${g.name.split(' ').slice(0,2).map(x=>x[0]).join('')}</span>`;
        };
        logo.appendChild(img);

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = g.name;

        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = (mode === 'player') ? 'Open Player' : 'Open Agent';

        inner.appendChild(logo);
        inner.appendChild(name);
        inner.appendChild(tag);
        card.appendChild(inner);

        const open = () => openGame(g);
        card.addEventListener('click', open);
        card.addEventListener('keydown', (e) => {
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
        });

        els.grid.appendChild(card);
      }
    }

    function openGame(game){
      if(mode === 'player'){
        if(game.playerUrl) window.open(game.playerUrl, '_blank', 'noopener,noreferrer');
        return;
      }

      // agent
      const a = game.agent;
      if(!a) return;

      if(typeof a === 'string'){
        window.open(a, '_blank', 'noopener,noreferrer');
        return;
      }

      // multiple agent links => modal
      openModal(game.name, a);
    }

    // ======= MODAL =======
    function openModal(gameName, links){
      els.modalTitle.textContent = `${gameName} — Agent`;
      els.modalSub.textContent = 'Choose a portal to open';
      els.modalLinks.innerHTML = '';

      for(const item of links){
        const a = document.createElement('a');
        a.className = 'linkbtn';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `<span>${item.label}</span><span class="arrow">↗</span>`;
        els.modalLinks.appendChild(a);
      }

      els.modalBackdrop.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal(){
      els.modalBackdrop.style.display = 'none';
      document.body.style.overflow = '';
    }

    els.modalClose.addEventListener('click', closeModal);
    els.modalBackdrop.addEventListener('click', (e)=>{ if(e.target === els.modalBackdrop) closeModal(); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });

    // ======= SPARKLES =======
    (function makeSparkles(){
      const N = 18;
      for(let i=0;i<N;i++){
        const s = document.createElement('div');
        s.className = 'sparkle';
        const x1 = Math.floor(Math.random()*100);
        const x2 = Math.floor(Math.random()*100);
        const t = (10 + Math.random()*18).toFixed(1);
        const sc = (0.6 + Math.random()*1.4).toFixed(2);
        const size = 6 + Math.random()*10;
        s.style.left = x1 + 'vw';
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.setProperty('--x1', x1 + 'vw');
        s.style.setProperty('--x2', x2 + 'vw');
        s.style.setProperty('--t', t + 's');
        s.style.setProperty('--s', sc);
        s.style.animationDelay = (-Math.random()*parseFloat(t)) + 's';
        els.sparkles.appendChild(s);
      }
    })();

    // first paint
    render();
  </script>
